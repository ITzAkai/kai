<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stremio Kai remote</title>
<style>
  :root { --bg: #0d0b14; --card: #1b1826; --key: #262236; --text: #f2f0f8; --muted: #9a94ad; --accent: #7b5bf5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .brand { font-size: 20px; } .brand b { color: #9d85ff; }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: #8fe3aa; } .status.bad { color: #ff8f8f; }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }
  button { font: inherit; color: var(--text); background: var(--key); border: 0; border-radius: 18px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button:active { transform: scale(0.96); background: #332d47; }
  .pad { position: relative; width: min(300px, 78vw); height: min(300px, 78vw); margin: 4px auto 0; border-radius: 50%; background: var(--card); }
  .pad button { position: absolute; width: 33%; height: 33%; border-radius: 50%; background: transparent; font-size: 30px; color: #d8d2ea; }
  .pad button:active { background: rgba(255,255,255,0.08); }
  .pad .up { top: 2%; left: 33.5%; } .pad .down { bottom: 2%; left: 33.5%; }
  .pad .left { left: 2%; top: 33.5%; } .pad .right { right: 2%; top: 33.5%; }
  .pad .ok { left: 31%; top: 31%; width: 38%; height: 38%; background: var(--accent); color: #fff; font-size: 20px; font-weight: 700; }
  .pad .ok:active { background: #6847e8; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  .row button { height: 58px; font-size: 22px; }
  .row button small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .type { display: flex; gap: 10px; }
  .type input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card); border: 2px solid #2d2840; border-radius: 16px; padding: 14px 16px; outline: none; }
  .type input:focus { border-color: var(--accent); }
  .type button { padding: 0 20px; background: var(--accent); font-weight: 700; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: -10px 0 0; }
  .pin { display: none; flex-direction: column; gap: 14px; align-items: center; text-align: center; padding-top: 30px; }
  .pin input { width: 200px; text-align: center; font-size: 34px; letter-spacing: 12px; color: var(--text); background: var(--card); border: 2px solid #2d2840; border-radius: 16px; padding: 12px; outline: none; }
  .pin button { padding: 14px 40px; background: var(--accent); font-weight: 700; }
  body.locked main { display: none; } body.locked .pin { display: flex; }
</style>
</head>
<body class="locked">
<header>
  <div class="brand">Stremio <b>Kai</b> remote</div>
  <div class="status" id="status">…</div>
</header>

<section class="pin">
  <div>Enter the PIN shown on the TV<br><small style="color:var(--muted)">Settings → Phone remote</small></div>
  <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····">
  <button id="pinGo">Connect</button>
</section>

<main>
  <div class="pad">
    <button class="up" data-key="38" aria-label="Up">▲</button>
    <button class="left" data-key="37" aria-label="Left">◀</button>
    <button class="ok" data-key="13">OK</button>
    <button class="right" data-key="39" aria-label="Right">▶</button>
    <button class="down" data-key="40" aria-label="Down">▼</button>
  </div>
  <div class="row">
    <button data-key="10009">↩<small>Back</small></button>
    <button data-key="10252">⏯<small>Play / pause</small></button>
    <button data-key="413">⏹<small>Stop</small></button>
  </div>
  <div class="row two">
    <button data-key="412">⏪<small>Rewind</small></button>
    <button data-key="417">⏩<small>Forward</small></button>
  </div>
  <form class="type" id="typeForm">
    <input id="text" placeholder="Type on the TV…" autocomplete="off" enterkeyhint="send">
    <button type="submit">Send</button>
  </form>
  <p class="hint">Typing fills the selected text box on the TV (search, sign-in…).</p>
</main>

<script>
(function () {
  var pin = '';
  var statusEl = document.getElementById('status');
  function status(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }

  // The QR code on the TV opens this page with #pin=1234, so scanning connects straight away.
  var m = location.hash.match(/pin=(\d{4})/);
  try { pin = (m && m[1]) || localStorage.getItem('kaiRemotePin') || ''; } catch (e) { pin = (m && m[1]) || ''; }
  if (m) history.replaceState(null, '', location.pathname);

  function check(p) {
    return fetch('/api/check?pin=' + encodeURIComponent(p)).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function unlock(p) {
    return check(p).then(function (ok) {
      if (!ok) { status('Wrong PIN', 'bad'); document.body.classList.add('locked'); return false; }
      pin = p;
      try { localStorage.setItem('kaiRemotePin', p); } catch (e) {}
      document.body.classList.remove('locked');
      status('Connected', 'ok');
      return true;
    });
  }
  document.getElementById('pinGo').onclick = function () { unlock(document.getElementById('pin').value.trim()); };
  document.getElementById('pin').onkeydown = function (e) { if (e.key === 'Enter') unlock(this.value.trim()); };

  function post(url, body) {
    return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'pin=' + encodeURIComponent(pin), { method: 'POST', body: body || '' })
      .then(function (r) {
        if (r.status === 401) { status('PIN changed: enter it again', 'bad'); document.body.classList.add('locked'); }
        else status('Connected', 'ok');
      })
      .catch(function () { status('TV not reachable', 'bad'); });
  }

  // Holding an arrow repeats it, like the real remote.
  Array.prototype.forEach.call(document.querySelectorAll('[data-key]'), function (b) {
    var code = b.getAttribute('data-key');
    var repeat = null, delay = null;
    var arrow = /^3[7-9]$|^40$/.test(code);
    function stop() { clearTimeout(delay); clearInterval(repeat); delay = repeat = null; }
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (navigator.vibrate) navigator.vibrate(10);
      post('/api/key?code=' + code);
      if (arrow) delay = setTimeout(function () { repeat = setInterval(function () { post('/api/key?code=' + code); }, 140); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, stop); });
  });

  document.getElementById('typeForm').onsubmit = function (e) {
    e.preventDefault();
    var input = document.getElementById('text');
    if (!input.value) return;
    post('/api/text?submit=1', input.value).then(function () { input.value = ''; });
  };

  if (pin) unlock(pin); else status('Locked');
})();
</script>
</body>
</html>
