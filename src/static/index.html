<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <!-- Só o código do próprio app roda; dados de addons/APIs nunca viram script. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: https://cdn.jsdelivr.net; style-src 'self' file: https://cdn.jsdelivr.net 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *; font-src 'self' file: https://cdn.jsdelivr.net; object-src 'none'; frame-src https://www.youtube-nocookie.com https://www.youtube.com">
  <!-- Only the app's origin is sent (YouTube embeds refuse to play without it). -->
  <meta name="referrer" content="origin">
  <title>Stremio Kai</title>
</head>
<body>
  <div id="app">
    <div id="boot" class="boot">
      <div class="boot-logo">Stremio <b>Kai</b></div>
      <div class="spinner"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="loader.js"></script>
</body>
</html>
